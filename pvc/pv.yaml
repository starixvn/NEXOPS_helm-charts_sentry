apiVersion: v1
kind: Namespace
metadata:
  name:  sentry

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name:  mysql-data-pv
spec:
  hostPath:
    path: "/var/www/mysql/data"
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteMany

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name:  mysql-data-pvc
  namespace: sentry
spec:
  resources:
    requests:
      storage: 2Gi
  accessModes:
  - ReadWriteMany

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-db
  namespace: sentry
  labels:
    app: my-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-db
  template:
    metadata:
      labels:
        app: my-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: mypwd
        volumeMounts:
        - name: db-data
          mountPath: "/var/lib/mysql"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: mysql-data-pvc